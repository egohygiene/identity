---
name: Replay reviewed guidance v1

on:
  push:
    branches:
      - feat/13-brand-guidance-v1
    paths:
      - .github/workflows/replay-guidance-v1.yml

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out current Identity branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/13-brand-guidance-v1
          fetch-depth: 0

      - name: Replay reviewed issue 13 implementation surfaces
        shell: bash
        run: |
          set -euo pipefail

          reviewed_commit="7e2b42cf6995c4846b59a710b54b581686cf1cd4"
          git fetch origin "${reviewed_commit}"

          reviewed_files=(
            "contracts/v1/approvals.schema.json"
            "contracts/v1/brand-guidance.schema.json"
            "contracts/v1/usage.schema.json"
            "contracts/v1/voice.schema.json"
            "docs/contracts/GUIDANCE_V1.md"
            "docs/decisions/ADR-013-preserve-guidance-lifecycle.md"
            "scripts/plan_v0_migration.py"
            "scripts/render_guidance.py"
            "scripts/validate_identity.py"
            "tests/fixtures/migration/empathy-v0/expected-plan.json"
            "tests/fixtures/v1/invalid/candidate-without-handoff.json"
            "tests/fixtures/v1/invalid/guidance-approval-mismatch.json"
            "tests/fixtures/v1/invalid/legacy-publication.json"
            "tests/fixtures/v1/invalid/public-candidate.json"
            "tests/fixtures/v1/valid/minimal/.identity/governance/approvals.json"
            "tests/fixtures/v1/valid/minimal/.identity/governance/provenance.json"
            "tests/fixtures/v1/valid/minimal/.identity/guidance/usage.json"
            "tests/fixtures/v1/valid/minimal/.identity/guidance/voice.json"
            "tests/fixtures/v1/valid/minimal/.identity/identity.json"
            "tests/fixtures/v1/valid/minimal/.identity/sources/legacy-wordmark.svg"
            "tests/fixtures/v1/valid/minimal/expected/brand-guidance.html"
            "tests/fixtures/v1/valid/minimal/expected/brand-guidance.json"
            "tests/fixtures/v1/valid/minimal/expected/brand-guidance.md"
            "tests/test_render_guidance.py"
            "tests/test_validate_identity_v1.py"
          )

          git checkout "${reviewed_commit}" -- "${reviewed_files[@]}"

          python3 -m unittest discover \
            --start-directory "tests" \
            --pattern "test_*.py" \
            --verbose
          python3 "scripts/validate_identity.py" \
            --repository-root "tests/fixtures/v1/valid/minimal" \
            --format "human"
          python3 -m compileall --quiet "scripts" "tests"

          git add -- "${reviewed_files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "feat(guidance): add governed voice and usage projections"
          git push origin HEAD:feat/13-brand-guidance-v1
