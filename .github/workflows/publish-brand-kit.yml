---
# Copyright 2026 Ego Hygiene
# SPDX-License-Identifier: MIT
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Publish Identity Brand Kit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-brand-kit.yml"
      - "publication/**"
      - "renderer/**"
      - "scripts/package_public_brand_kit.py"
      - "docs/decisions/**"
      - ".config/egolint/repository-intelligence.toml"
      - "scripts/identity_decisions_publication.py"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Stable Identity release tag to project"
        required: true
        default: "v1.0.0"
        type: string
      intelligence_revision:
        description: "Optional full ancestor commit for Decisions replay; empty uses the publisher revision"
        required: false
        default: ""
        type: string
      intelligence_compare:
        description: "Optional Compare capture: off, seed a real first pair, or compare with an exact retained baseline"
        required: false
        default: "off"
        type: choice
        options:
          - "off"
          - "seed"
          - "compare"
      intelligence_compare_baseline:
        description: "Complete reviewed baseline JSON record; required only for compare, empty for off/seed"
        required: false
        default: ""
        type: string
      intelligence_review_plan:
        description: "Optional checked-in public typed review plan at the current source revision; empty leaves review feeds unavailable"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: "identity-brand-kit-pages"
  cancel-in-progress: false

env:
  CANONICAL_URL: "https://identity.egohygiene.io/"

jobs:
  build:
    name: Build immutable public Brand Kit
    if: >-
      github.event_name != 'release' ||
      (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      pages: write

    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_commit: ${{ steps.release.outputs.commit }}
      publisher_commit: ${{ steps.publisher.outputs.commit }}
      intelligence_commit: ${{ steps.publisher.outputs.intelligence-commit }}
      handoff_artifact: ${{ steps.publisher.outputs.handoff-artifact }}
      handoff_digest: ${{ steps.handoff.outputs.artifact-digest }}
      composed_site_digest: ${{ steps.composition.outputs.composed-site-digest }}
      rollback_revision: ${{ steps.rollback.outputs.revision }}
      rollback_site_digest: ${{ steps.rollback.outputs.site-digest }}
      rollback_url: ${{ steps.rollback.outputs.url }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out the Pages publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "main"
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the exact publisher and Decisions revisions
        id: publisher
        env:
          MANUAL_INTELLIGENCE_REVISION: ${{ inputs.intelligence_revision }}
        shell: bash
        run: |
          set -euo pipefail
          publisher_commit="$(git rev-parse HEAD^{commit})"
          intelligence_commit="${MANUAL_INTELLIGENCE_REVISION:-${publisher_commit}}"
          if [[ ! "${intelligence_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Decisions revision must be a full lowercase commit SHA."
            exit 1
          fi
          git cat-file -e "${intelligence_commit}^{commit}"
          git merge-base --is-ancestor "${intelligence_commit}" "${publisher_commit}"
          {
            printf 'commit=%s\n' "${publisher_commit}"
            printf 'intelligence-commit=%s\n' "${intelligence_commit}"
            printf 'handoff-artifact=identity-decisions-publication-%s-%s-%s\n' \
              "${publisher_commit}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve the recorded prior deployment recovery point
        id: rollback
        shell: bash
        run: |
          set -euo pipefail
          recovery="publication/decisions-rollback.json"
          revision="$(jq --exit-status --raw-output '.consumerRevision' "${recovery}")"
          site_digest="$(jq --exit-status --raw-output '.siteDigest' "${recovery}")"
          deployment_url="$(jq --exit-status --raw-output '.deploymentUrl' "${recovery}")"
          if [[ ! "${revision}" =~ ^[0-9a-f]{40}$ || \
                ! "${site_digest}" =~ ^sha256:[0-9a-f]{64}$ || \
                "${deployment_url}" != "${CANONICAL_URL}" ]]; then
            echo "::error::The recorded prior deployment recovery point is invalid."
            exit 1
          fi
          {
            printf 'revision=%s\n' "${revision}"
            printf 'site-digest=%s\n' "${site_digest}"
            printf 'url=%s\n' "${deployment_url}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve immutable stable release source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          case "${EVENT_NAME}" in
            "release")
              requested_tag="${RELEASE_EVENT_TAG}"
              ;;
            "workflow_dispatch")
              requested_tag="${MANUAL_RELEASE_TAG}"
              ;;
            "push")
              requested_tag="$(jq --raw-output '.release.defaultTag' "publication/identity-brand-kit.config.json")"
              ;;
            *)
              echo "::error::Unsupported Pages publication event: ${EVENT_NAME}"
              exit 1
              ;;
          esac

          if [[ ! "${requested_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only stable semantic-version Identity releases may publish the public Brand Kit."
            exit 1
          fi

          release="$(gh release view "${requested_tag}" --json "isDraft,isPrerelease,url")"
          if [[ "$(jq --raw-output '.isDraft' <<<"${release}")" != "false" || "$(jq --raw-output '.isPrerelease' <<<"${release}")" != "false" ]]; then
            echo "::error::${requested_tag} is not a published stable GitHub release."
            exit 1
          fi

          git fetch --force --tags origin "refs/tags/${requested_tag}:refs/tags/${requested_tag}"
          if [[ "$(git cat-file --batch-check="%(objecttype)" <<<"${requested_tag}")" != "tag" ]]; then
            echo "::error::${requested_tag} must be an annotated Git tag."
            exit 1
          fi

          release_commit="$(git rev-parse "${requested_tag}^{}")"
          release_source="${RUNNER_TEMP}/identity-release-source"
          git worktree add --detach "${release_source}" "${release_commit}"

          release_config="${release_source}/publication/identity-brand-kit.config.json"
          if [[ ! -f "${release_config}" ]]; then
            compatibility_index="${GITHUB_WORKSPACE}/publication/release-configs/index.json"
            compatibility_config="$(
              jq \
                --exit-status \
                --raw-output \
                --arg release_tag "${requested_tag}" \
                '.releases[$release_tag].config' \
                "${compatibility_index}"
            )"
            expected_commit="$(
              jq \
                --exit-status \
                --raw-output \
                --arg release_tag "${requested_tag}" \
                '.releases[$release_tag].commit' \
                "${compatibility_index}"
            )"
            expected_config_digest="$(
              jq \
                --exit-status \
                --raw-output \
                --arg release_tag "${requested_tag}" \
                '.releases[$release_tag].sha256' \
                "${compatibility_index}"
            )"
            release_config="${GITHUB_WORKSPACE}/${compatibility_config}"

            if [[ "${expected_commit}" != "${release_commit}" ]]; then
              echo "::error::Compatibility config commit does not match ${requested_tag}."
              exit 1
            fi
            if [[ ! -f "${release_config}" ]]; then
              echo "::error::No release-owned or compatibility publication config exists for ${requested_tag}."
              exit 1
            fi
            if [[ "$(sha256sum "${release_config}" | cut --delimiter=' ' --fields=1)" != "${expected_config_digest}" ]]; then
              echo "::error::Compatibility publication config digest does not match its index."
              exit 1
            fi
          fi

          if [[ "$(jq --raw-output '.release.defaultTag' "${release_config}")" != "${requested_tag}" || "$(jq --raw-output '.release.defaultCommit' "${release_config}")" != "${release_commit}" ]]; then
            echo "::error::Publication config is not bound to the selected release tag and commit."
            exit 1
          fi

          echo "tag=${requested_tag}" >> "${GITHUB_OUTPUT}"
          echo "commit=${release_commit}" >> "${GITHUB_OUTPUT}"
          echo "source=${release_source}" >> "${GITHUB_OUTPUT}"
          echo "config=${release_config}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"

      - name: Verify release-bound publication configuration
        env:
          RELEASE_SOURCE: ${{ steps.release.outputs.source }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_CONFIG: ${{ steps.release.outputs.config }}
        run: >-
          python3 scripts/verify_publication_release_configs.py
          --repository-root "."
          --config "${RELEASE_CONFIG}"
          --source-root "${RELEASE_SOURCE}"
          --release-tag "${RELEASE_TAG}"
          --release-commit "${RELEASE_COMMIT}"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Activate pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@11.21.0" --activate
          pnpm --version

      - name: Install frozen renderer dependencies
        working-directory: renderer
        run: pnpm install --frozen-lockfile

      - name: Build release-backed public site
        working-directory: renderer
        env:
          RELEASE_SOURCE: ${{ steps.release.outputs.source }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_CONFIG: ${{ steps.release.outputs.config }}
        run: >-
          pnpm run build:public --
          --source-root "${RELEASE_SOURCE}"
          --release-tag "${RELEASE_TAG}"
          --release-commit "${RELEASE_COMMIT}"
          --config "${RELEASE_CONFIG}"

      - name: Verify public artifact contract
        working-directory: renderer
        run: pnpm run verify:public

      - name: Retain verified bytes from the prior public deployment
        run: >-
          python3 scripts/identity_decisions_publication.py
          --operation capture-rollback
          --rollback-record publication/decisions-rollback.json
          --canonical-url "${CANONICAL_URL}"
          --evidence-directory .relay/repository-intelligence-deployment

      - name: Capture the unchanged Brand Kit before composition
        uses: egohygiene/relay/actions/repository-intelligence-deployment-provenance@5d27be5ce1599df883e31f14cd894eb18622c18c
        with:
          operation: capture-baseline
          site-directory: renderer/dist
          intelligence-directory: renderer/dist/intelligence
          consumer-revision: ${{ steps.publisher.outputs.intelligence-commit }}

      - name: Admit current provider capture and optional exact Compare selection
        id: compare_selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_SOURCE_COMMIT: ${{ github.sha }}
          PUBLISHER_COMMIT: ${{ steps.publisher.outputs.commit }}
          INTELLIGENCE_COMMIT: ${{ steps.publisher.outputs.intelligence-commit }}
          COMPARE_MODE: ${{ inputs.intelligence_compare }}
          COMPARE_BASELINE: ${{ inputs.intelligence_compare_baseline }}
          REVIEW_PLAN: ${{ inputs.intelligence_review_plan }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PYTHON'
          import json
          import os
          import re

          event = os.environ["EVENT_NAME"]
          mode = os.environ["COMPARE_MODE"] or "off"
          raw = os.environ["COMPARE_BASELINE"]
          keys = ("lease", "artifact_id", "artifact_digest", "source_commit", "run_id", "run_attempt")
          values = dict.fromkeys(keys, "")
          enabled = mode != "off"
          current_source = (event in {"push", "workflow_dispatch"}
              and os.environ["REF_NAME"] == os.environ["DEFAULT_BRANCH"]
              and os.environ["PUBLISHER_COMMIT"] == os.environ["EVENT_SOURCE_COMMIT"]
              and os.environ["INTELLIGENCE_COMMIT"] == os.environ["EVENT_SOURCE_COMMIT"])
          review_plan = os.environ["REVIEW_PLAN"]
          if review_plan:
              if event != "workflow_dispatch" or not current_source:
                  raise SystemExit("Review feeds require the current default-branch publisher/source revision")
              if (len(review_plan) > 240 or not re.fullmatch(r"[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*", review_plan)
                      or any(part in {".", "..", ".git"} for part in review_plan.split("/"))):
                  raise SystemExit("Select a canonical repository-relative typed review plan path")
          if event != "workflow_dispatch" or not enabled:
              if raw or (event != "workflow_dispatch" and enabled):
                  raise SystemExit("Compare requires an explicit manual selection")
          else:
              if not current_source:
                  raise SystemExit("Compare requires the current default-branch publisher/source revision")
              if mode == "seed" and not raw:
                  values["lease"] = "none"
              elif mode == "compare" and 0 < len(raw) <= 2048:
                  def unique(pairs):
                      result = {}
                      for key, value in pairs:
                          if key in result:
                              raise ValueError("Duplicate baseline field")
                          result[key] = value
                      return result
                  values = json.loads(raw, object_pairs_hook=unique)
                  patterns = {
                      "lease": r"[0-9a-f]{64}:[0-9a-f]{64}",
                      "artifact_id": r"[1-9][0-9]{0,19}",
                      "artifact_digest": r"(?:sha256:)?[0-9a-f]{64}",
                      "source_commit": r"[0-9a-f]{40}",
                      "run_id": r"[1-9][0-9]{0,19}",
                      "run_attempt": r"[1-9][0-9]{0,5}",
                  }
                  if (not isinstance(values, dict) or set(values) != set(keys)
                          or any(not isinstance(values[key], str)
                              or not re.fullmatch(patterns[key], values[key]) for key in keys)):
                      raise SystemExit("Select all exact Compare baseline fields together")
              else:
                  raise SystemExit("Use seed with no baseline, or compare with a complete baseline record")
          values["enabled"] = str(enabled).lower()
          values["mode"] = mode
          values["capture_enabled"] = str(current_source).lower()
          values["review_plan"] = review_plan
          values["review_enabled"] = str(bool(review_plan)).lower()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as target:
              for key, value in values.items():
                  target.write(key + "=" + value + "\n")
          PYTHON

      - name: Capture bounded public Work, Health and Releases sources
        id: public_sources
        if: steps.compare_selection.outputs.capture_enabled == 'true'
        uses: egohygiene/relay/actions/repository-intelligence-github-sources@5d27be5ce1599df883e31f14cd894eb18622c18c
        with:
          github-token: ${{ github.token }}
          sources: work,health,releases

      - name: Retain exact same-run source captures
        id: source_capture_upload
        if: steps.compare_selection.outputs.capture_enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.public_sources.outputs.artifact-name }}
          path: ${{ steps.public_sources.outputs.artifact-directory }}
          overwrite: false
          if-no-files-found: error
          retention-days: 30

      - name: Retain bounded source producer evidence independently
        if: always() && steps.public_sources.outputs.producer-receipt != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: identity-source-producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.public_sources.outputs.producer-receipt }}
          overwrite: false
          if-no-files-found: error
          retention-days: 30

      - name: Keep the bounded source receipt with private publication evidence
        if: steps.compare_selection.outputs.capture_enabled == 'true'
        env:
          SOURCE_PRODUCER_RECEIPT: ${{ steps.public_sources.outputs.producer-receipt }}
        shell: bash
        run: cp -- "${SOURCE_PRODUCER_RECEIPT}" .relay/repository-intelligence-deployment/source-producer.json

      - name: Normalize supplied public typed audit and architecture reviews
        id: review_feed
        if: steps.compare_selection.outputs.review_enabled == 'true'
        uses: egohygiene/relay/actions/repository-intelligence-review-feed@5d27be5ce1599df883e31f14cd894eb18622c18c
        with:
          source-root: ${{ github.workspace }}
          plan: ${{ steps.compare_selection.outputs.review_plan }}
          repository: ${{ github.repository }}
          represented-commit: ${{ steps.publisher.outputs.intelligence-commit }}
          as-of: ${{ steps.public_sources.outputs.as-of }}
          output-directory: .cache/repository-review-feed

      - name: Retain the separate normalized review-feed artifact
        id: review_feed_upload
        if: always() && steps.review_feed.outputs.artifact-directory != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: identity-review-feed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.review_feed.outputs.artifact-directory }}
          include-hidden-files: true
          overwrite: false
          if-no-files-found: error
          retention-days: 30

      - name: Build validated Repository Intelligence from canonical ADRs
        id: intelligence
        uses: egohygiene/relay/actions/repository-intelligence@5d27be5ce1599df883e31f14cd894eb18622c18c
        with:
          collect-adrs: "true"
          collect-journey: "true"
          search-attribution: "true"
          collect-dependencies: ${{ steps.compare_selection.outputs.capture_enabled }}
          source-capture-artifact-id: ${{ steps.source_capture_upload.outputs.artifact-id }}
          source-capture-artifact-digest: ${{ steps.source_capture_upload.outputs.artifact-digest }}
          observatory-audits: ${{ steps.review_feed.outputs.repository-audits }}
          observatory-sanity: ${{ steps.review_feed.outputs.repository-sanity }}
          as-of: ${{ steps.public_sources.outputs.as-of }}
          output-directory: renderer/dist/intelligence
          work-directory: .cache/repository-intelligence
          source-commit: ${{ steps.publisher.outputs.intelligence-commit }}
          activity-ref: ${{ steps.publisher.outputs.intelligence-commit }}
          require-full-history: "true"

      - name: Retain the selected native pair and compose Compare in place
        id: compare
        if: steps.compare_selection.outputs.enabled == 'true'
        uses: egohygiene/relay/actions/repository-intelligence-compare-artifact@5d27be5ce1599df883e31f14cd894eb18622c18c
        with:
          source-directory: ${{ github.workspace }}/.cache/repository-intelligence/sources
          intelligence-directory: renderer/dist/intelligence
          as-of: ${{ steps.public_sources.outputs.as-of }}
          normalization-profile: search-attribution-v1
          expected-baseline: ${{ steps.compare_selection.outputs.lease }}
          baseline-artifact-id: ${{ steps.compare_selection.outputs.artifact_id }}
          baseline-artifact-digest: ${{ steps.compare_selection.outputs.artifact_digest }}
          baseline-source-commit: ${{ steps.compare_selection.outputs.source_commit }}
          baseline-run-id: ${{ steps.compare_selection.outputs.run_id }}
          baseline-run-attempt: ${{ steps.compare_selection.outputs.run_attempt }}
          retention-days: "30"

      - name: Keep the review-feed receipt with private publication evidence
        if: steps.compare_selection.outputs.review_enabled == 'true'
        env:
          REVIEW_FEED_RECEIPT: ${{ steps.review_feed.outputs.receipt-path }}
        shell: bash
        run: cp -- "${REVIEW_FEED_RECEIPT}" .relay/repository-intelligence-deployment/review-feed.json

      - name: Compose the consumer-owned Decisions alias
        run: >-
          python3 scripts/identity_decisions_publication.py
          --operation compose
          --site-directory renderer/dist
          --canonical-url "${CANONICAL_URL}"

      - name: Verify composed routes and byte-preserved Brand Kit
        id: composition
        uses: egohygiene/relay/actions/repository-intelligence-deployment-provenance@5d27be5ce1599df883e31f14cd894eb18622c18c
        with:
          operation: verify-composition
          site-directory: renderer/dist
          intelligence-directory: renderer/dist/intelligence
          consumer-revision: ${{ steps.publisher.outputs.intelligence-commit }}
          relay-revision: 5d27be5ce1599df883e31f14cd894eb18622c18c
          required-routes: '["/","/brand-kit/","/intelligence/","/intelligence/decisions/","/decisions/"]'
          aliases: '[{"route":"/decisions/","target":"/intelligence/decisions/"}]'

      - name: Record the separate publisher and source bindings
        env:
          PUBLISHER_COMMIT: ${{ steps.publisher.outputs.commit }}
          INTELLIGENCE_COMMIT: ${{ steps.publisher.outputs.intelligence-commit }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          COMPARE_MODE: ${{ steps.compare_selection.outputs.mode }}
          COMPARE_STATUS: ${{ steps.compare.outputs.status }}
          COMPARE_ARTIFACT_ID: ${{ steps.compare.outputs.artifact-id }}
          COMPARE_ARTIFACT_DIGEST: ${{ steps.compare.outputs.artifact-digest }}
          COMPARE_NEXT_LEASE: ${{ steps.compare.outputs.next-baseline-lease }}
          SOURCE_CAPTURE_ID: ${{ steps.source_capture_upload.outputs.artifact-id }}
          SOURCE_CAPTURE_DIGEST: ${{ steps.source_capture_upload.outputs.artifact-digest }}
          SOURCE_CAPTURE_AS_OF: ${{ steps.public_sources.outputs.as-of }}
          REVIEW_FEED_ENABLED: ${{ steps.compare_selection.outputs.review_enabled }}
          REVIEW_FEED_RECEIPT_SHA256: ${{ steps.review_feed.outputs.receipt-sha256 }}
          REVIEW_FEED_ARTIFACT_ID: ${{ steps.review_feed_upload.outputs.artifact-id }}
          REVIEW_FEED_ARTIFACT_DIGEST: ${{ steps.review_feed_upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          binding = {
              "repository": "egohygiene/identity",
              "publisher_revision": os.environ["PUBLISHER_COMMIT"],
              "intelligence_revision": os.environ["INTELLIGENCE_COMMIT"],
              "brand_kit_release": {
                  "tag": os.environ["RELEASE_TAG"],
                  "revision": os.environ["RELEASE_COMMIT"],
              },
              "relay_revision": "5d27be5ce1599df883e31f14cd894eb18622c18c",
          }
          if os.environ["SOURCE_CAPTURE_ID"]:
              binding["source_capture"] = {
                  "artifact_id": os.environ["SOURCE_CAPTURE_ID"],
                  "artifact_digest": os.environ["SOURCE_CAPTURE_DIGEST"],
                  "as_of": os.environ["SOURCE_CAPTURE_AS_OF"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              }
          if os.environ["COMPARE_MODE"] != "off":
              artifact_id = os.environ["COMPARE_ARTIFACT_ID"]
              binding["compare"] = {
                  "mode": os.environ["COMPARE_MODE"],
                  "status": os.environ["COMPARE_STATUS"],
                  "selection_candidate": {
                      "lease": os.environ["COMPARE_NEXT_LEASE"],
                      "artifact_id": artifact_id,
                      "artifact_digest": os.environ["COMPARE_ARTIFACT_DIGEST"],
                      "source_commit": os.environ["INTELLIGENCE_COMMIT"],
                      "run_id": os.environ["GITHUB_RUN_ID"],
                      "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  } if artifact_id else None,
              }
          if os.environ["REVIEW_FEED_ENABLED"] == "true":
              binding["review_feed"] = {
                  "repository": "egohygiene/identity",
                  "represented_commit": os.environ["INTELLIGENCE_COMMIT"],
                  "as_of": os.environ["SOURCE_CAPTURE_AS_OF"],
                  "receipt_sha256": os.environ["REVIEW_FEED_RECEIPT_SHA256"],
                  "artifact_name": "identity-review-feed-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"],
                  "artifact_id": os.environ["REVIEW_FEED_ARTIFACT_ID"],
                  "artifact_digest": os.environ["REVIEW_FEED_ARTIFACT_DIGEST"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              }
          Path(".relay/repository-intelligence-deployment/source-binding.json").write_text(
              json.dumps(binding, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PYTHON

      - name: Preserve exact site and private deployment verification inputs
        id: handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.publisher.outputs.handoff-artifact }}
          path: |
            renderer/dist
            .relay/repository-intelligence-deployment/consumer-route-baseline.json
            .relay/repository-intelligence-deployment/composition-verification.json
            .relay/repository-intelligence-deployment/source-binding.json
            .relay/repository-intelligence-deployment/source-producer.json
            .relay/repository-intelligence-deployment/review-feed.json
            .relay/repository-intelligence-deployment/rollback-site.tar
            .relay/repository-intelligence-deployment/rollback-record.json
            .relay/repository-intelligence-deployment/rollback-capture.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: renderer/dist

  deploy:
    name: Deploy Identity Brand Kit
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out the exact trusted publisher for live verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.publisher_commit }}
          persist-credentials: false

      - name: Download the exact composed-site handoff
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.handoff_artifact }}
          path: .

      - name: Revalidate downloaded composition before deployment
        id: composition
        uses: egohygiene/relay/actions/repository-intelligence-deployment-provenance@5d27be5ce1599df883e31f14cd894eb18622c18c
        with:
          operation: verify-composition
          site-directory: renderer/dist
          intelligence-directory: renderer/dist/intelligence
          consumer-revision: ${{ needs.build.outputs.intelligence_commit }}
          relay-revision: 5d27be5ce1599df883e31f14cd894eb18622c18c
          required-routes: '["/","/brand-kit/","/intelligence/","/intelligence/decisions/","/decisions/"]'
          aliases: '[{"route":"/decisions/","target":"/intelligence/decisions/"}]'

      - name: Confirm the build and deployment site identities agree
        env:
          BUILD_DIGEST: ${{ needs.build.outputs.composed_site_digest }}
          DEPLOY_DIGEST: ${{ steps.composition.outputs.composed-site-digest }}
        shell: bash
        run: |
          set -euo pipefail
          test "${BUILD_DIGEST}" = "${DEPLOY_DIGEST}"

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify the configured canonical domain
        env:
          EXPECTED_RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          EXPECTED_RELEASE_COMMIT: ${{ needs.build.outputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail

          verification_directory="$(mktemp --directory)"
          trap 'rm --force --recursive "${verification_directory}"' EXIT
          site_json="${verification_directory}/site.json"
          page_html="${verification_directory}/index.html"

          for attempt in {1..30}; do
            if curl \
              --fail \
              --location \
              --max-time 30 \
              --proto "=https" \
              --proto-redir "=https" \
              --retry 2 \
              --retry-all-errors \
              --show-error \
              --silent \
              --output "${site_json}" \
              "${CANONICAL_URL}site.json?release=${EXPECTED_RELEASE_TAG}"
            then
              if [[ "$(jq --raw-output '.release.tag' "${site_json}")" == "${EXPECTED_RELEASE_TAG}" && "$(jq --raw-output '.release.commit' "${site_json}")" == "${EXPECTED_RELEASE_COMMIT}" ]]; then
                break
              fi
            fi
            rm --force "${site_json}"
            sleep 10
          done

          test -s "${site_json}"
          test "$(jq --raw-output '.canonicalUrl' "${site_json}")" = "${CANONICAL_URL}"
          test "$(jq --raw-output '.release.tag' "${site_json}")" = "${EXPECTED_RELEASE_TAG}"
          test "$(jq --raw-output '.release.commit' "${site_json}")" = "${EXPECTED_RELEASE_COMMIT}"
          curl \
            --fail \
            --location \
            --max-time 30 \
            --proto "=https" \
            --proto-redir "=https" \
            --show-error \
            --silent \
            --output "${page_html}" \
            "${CANONICAL_URL}"
          grep --fixed-strings --quiet "${CANONICAL_URL}" "${page_html}"
          grep --fixed-strings --quiet "Release ${EXPECTED_RELEASE_TAG#v}" "${page_html}"

      - name: Verify live Decisions, alias, and preserved Brand Kit bytes
        run: >-
          python3 scripts/identity_decisions_publication.py
          --operation verify-live
          --site-directory renderer/dist
          --canonical-url "${CANONICAL_URL}"
          --evidence-directory .relay/repository-intelligence-deployment

      - name: Record the actual deployment result independently of live verification
        id: receipt
        if: >-
          always() && steps.download.outcome == 'success' &&
          contains(fromJSON('["success","failure","cancelled"]'), steps.deployment.outcome)
        uses: egohygiene/relay/actions/repository-intelligence-deployment-provenance@5d27be5ce1599df883e31f14cd894eb18622c18c
        with:
          operation: record-receipt
          site-directory: renderer/dist
          intelligence-directory: renderer/dist/intelligence
          consumer-revision: ${{ needs.build.outputs.intelligence_commit }}
          relay-revision: 5d27be5ce1599df883e31f14cd894eb18622c18c
          required-routes: '["/","/brand-kit/","/intelligence/","/intelligence/decisions/","/decisions/"]'
          aliases: '[{"route":"/decisions/","target":"/intelligence/decisions/"}]'
          workflow-run-id: ${{ github.run_id }}
          workflow-run-attempt: ${{ github.run_attempt }}
          deployment-environment: github-pages
          deployment-url: https://identity.egohygiene.io/
          deployment-conclusion: ${{ steps.deployment.outcome }}
          rollback-revision: ${{ needs.build.outputs.rollback_revision }}
          rollback-site-digest: ${{ needs.build.outputs.rollback_site_digest }}
          rollback-url: ${{ needs.build.outputs.rollback_url }}

      - name: Preserve deployment and live-verification evidence
        if: always() && steps.download.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: identity-decisions-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: .relay/repository-intelligence-deployment/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
