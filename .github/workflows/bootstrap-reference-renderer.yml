# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Bootstrap reference renderer evidence

on:
  push:
    branches:
      - feat/14-reference-brand-kit-renderer
    paths:
      - ".github/workflows/bootstrap-reference-renderer.yml"
      - "assets/identity/**"
      - "renderer/**"

permissions:
  contents: read

concurrency:
  group: "identity-renderer-bootstrap-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Generate locked renderer evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout Identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Activate pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@11.21.0" --activate
          pnpm --version

      - name: Resolve and install renderer dependencies
        working-directory: renderer
        run: pnpm install --no-frozen-lockfile

      - name: Install pinned Chromium
        working-directory: renderer
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate source and unit contracts
        working-directory: renderer
        run: |
          pnpm run check
          pnpm run test
          pnpm run build

      - name: Generate browser and visual baselines
        working-directory: renderer
        run: pnpm run test:e2e:update

      - name: Upload lockfile and visual baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reference-renderer-bootstrap
          path: |
            renderer/pnpm-lock.yaml
            renderer/tests/e2e/__snapshots__/
            renderer/playwright-report/
            renderer/test-results/
          if-no-files-found: warn
          retention-days: 7
