name: Validate Identity experience

on:
  pull_request:
    paths:
      - ".github/workflows/identity-experience.yml"
      - "assets/identity/**"
      - "contracts/v1/identity-experience-*.schema.json"
      - "experience/**"
      - "mascot/**"
      - "publication/identity-experience*"
      - "scripts/build_identity_experience.py"
      - "scripts/verify_identity_experience.py"
      - "tests/test_identity_experience.py"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/identity-experience.yml"
      - "assets/identity/**"
      - "contracts/v1/identity-experience-*.schema.json"
      - "experience/**"
      - "mascot/**"
      - "publication/identity-experience*"
      - "scripts/build_identity_experience.py"
      - "scripts/verify_identity_experience.py"
      - "tests/test_identity_experience.py"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Stable Identity release tag to bind"
        required: true
        default: "v1.1.0"
        type: string
      release_commit:
        description: "Full release commit; defaults to the dispatched revision"
        required: false
        type: string
      verify_live_brand_kit:
        description: "Compare the composite with the canonical Brand Kit site.json"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: "identity-experience-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  CANDIDATE_RELEASE_TAG: "v1.1.0"
  HOLON_COMMIT: "2600baff6f6d944094da81b77e1a9a2e9e7a1cd6"

jobs:
  validate:
    name: Build and verify composite (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out Identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the accepted Holon site suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: egohygiene/holon
          ref: ${{ env.HOLON_COMMIT }}
          path: .pinned/holon
          persist-credentials: false

      - name: Resolve candidate release binding
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_COMMIT: ${{ github.sha }}
          PR_HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
          MANUAL_TAG: ${{ inputs.release_tag }}
          MANUAL_COMMIT: ${{ inputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${CANDIDATE_RELEASE_TAG}"
          release_commit="${DEFAULT_COMMIT}"
          case "${EVENT_NAME}" in
            "pull_request") release_commit="${PR_HEAD_COMMIT}" ;;
            "push")
              if [[ "${REF_NAME}" == v* ]]; then
                release_tag="${REF_NAME}"
              fi
              ;;
            "workflow_dispatch")
              release_tag="${MANUAL_TAG}"
              if [[ -n "${MANUAL_COMMIT}" ]]; then
                release_commit="${MANUAL_COMMIT}"
              fi
              ;;
          esac
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "commit=${release_commit}" >> "${GITHUB_OUTPUT}"

      - name: Verify the checked-out Holon commit
        shell: bash
        run: test "$(git -C .pinned/holon rev-parse HEAD)" = "${HOLON_COMMIT}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"

      - name: Install the pinned Python resolver
        run: python3 -m pip install "uv==0.11.33"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.19.0"

      - name: Activate pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@11.24.0" --activate
          pnpm --version

      - name: Install frozen browser-evidence dependencies
        working-directory: experience
        run: pnpm install --frozen-lockfile

      - name: Install the selected browser
        working-directory: experience
        run: pnpm exec playwright install --with-deps "${{ matrix.browser }}"

      - name: Build the reviewed composite twice
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_identity_experience.py \
            --repository-root "." \
            --holon-source ".pinned/holon" \
            --output ".identity-experience-build" \
            --release-tag "${RELEASE_TAG}" \
            --release-commit "${RELEASE_COMMIT}"
          python3 scripts/build_identity_experience.py \
            --repository-root "." \
            --holon-source ".pinned/holon" \
            --output ".identity-experience-repeat" \
            --release-tag "${RELEASE_TAG}" \
            --release-commit "${RELEASE_COMMIT}"
          diff --recursive --brief \
            ".identity-experience-build" \
            ".identity-experience-repeat"

      - name: Verify routes, links, accessibility inputs, checksums, and evidence
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: >-
          python3 scripts/verify_identity_experience.py
          --repository-root "."
          --artifact-root ".identity-experience-build"
          --expected-release-tag "${RELEASE_TAG}"
          --expected-release-commit "${RELEASE_COMMIT}"

      - name: Run focused adapter and artifact tests
        run: python3 -m unittest tests.test_identity_experience --verbose

      - name: Verify the selected browser behavior
        working-directory: experience
        run: pnpm exec playwright test --project "${{ matrix.browser }}"

      - name: Create deterministic route-owner handoff
        if: matrix.browser == 'chromium'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir --parents "handoff"
          archive="handoff/identity-experience-${RELEASE_TAG}.tar"
          repeat_archive="handoff/identity-experience-${RELEASE_TAG}.repeat.tar"
          tar \
            --create \
            --file "${archive}" \
            --directory ".identity-experience-build" \
            --sort "name" \
            --mtime "@0" \
            --owner "0" \
            --group "0" \
            --numeric-owner \
            "."
          tar \
            --create \
            --file "${repeat_archive}" \
            --directory ".identity-experience-repeat" \
            --sort "name" \
            --mtime "@0" \
            --owner "0" \
            --group "0" \
            --numeric-owner \
            "."
          cmp "${archive}" "${repeat_archive}"
          sha256sum --binary "${archive}" > "${archive}.sha256"

      - name: Verify the canonical Brand Kit release binding
        if: github.event_name == 'workflow_dispatch' && inputs.verify_live_brand_kit && matrix.browser == 'chromium'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: >-
          python3 scripts/verify_identity_experience.py
          --repository-root "."
          --artifact-root ".identity-experience-build"
          --expected-release-tag "${RELEASE_TAG}"
          --expected-release-commit "${RELEASE_COMMIT}"
          --verify-live-brand-kit

      - name: Upload composite and review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: identity-experience-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .identity-experience-build/
            experience/playwright-report/
            experience/test-results/
            handoff/
          if-no-files-found: warn
          retention-days: 30
