[workspace]
resolver = "3"

[package]
name = "identity"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "A local-first Brand Kit compiler and creative handoff tool."
license = "MIT"
repository = "https://github.com/egohygiene/identity"
publish = false

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
toml = "0.9.8"

[dev-dependencies]
tempfile = "3.23.0"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
